
name: Self-Hosted Runner CI

on:
  workflow_dispatch:

jobs:
  build-and-publish-artifact:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Build Docker image
        run: docker build -t self_hosted_app:latest .

      - name: Create artifact folder
        run: mkdir -p artifact

      - name: Save Docker image as TAR
        run: docker save self_hosted_app:latest -o artifact/self_hosted_app.tar

      - name: Create ZIP file
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          zip -j artifact/self_hosted_app.zip artifact/self_hosted_app.tar

      - name: Upload ZIP as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-hosted-docker-image
          path: artifact/self_hosted_app.zip
          if-no-files-found: error
          retention-days: 7

